/* ---- drawing helpers (plain SVG strings; no markers, so they work on hidden slides) ---- */
function fig(svg, cap){ return '<figure class="diagram-wrap">'+svg+'<figcaption>'+cap+'</figcaption></figure>'; }
function svgOpen(w, h, aria, maxw){ return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+aria+'" style="max-width:'+(maxw||w)+'px;width:100%;height:auto;color:var(--ink);">'; }
function lab(x, y, txt, o){
  o = o || {};
  return '<text x="'+x+'" y="'+y+'" text-anchor="'+(o.anchor||'middle')+'" font-size="'+(o.size||11)+'"'+
    (o.bold?' font-weight="700"':'')+' style="fill:'+(o.color||'currentColor')+'">'+txt+'</text>';
}
function arrow(x1, y1, x2, y2, color){
  var a = Math.atan2(y2-y1, x2-x1), h = 7, c = color || 'currentColor';
  var bx = x2 - h*Math.cos(a), by = y2 - h*Math.sin(a);
  var px = -Math.sin(a)*h*0.5, py = Math.cos(a)*h*0.5;
  return '<line x1="'+x1+'" y1="'+y1+'" x2="'+bx+'" y2="'+by+'" stroke="'+c+'" stroke-width="1.6"/>'+
    '<polygon points="'+x2+','+y2+' '+(bx+px)+','+(by+py)+' '+(bx-px)+','+(by-py)+'" style="fill:'+c+'"/>';
}
function box(x, y, w, h, txt, kind){
  var fill = kind==='a' ? 'var(--accent-soft)' : kind==='g' ? 'var(--accent2-soft)' : kind==='w' ? 'var(--surface-2)' : 'var(--surface)';
  var stroke = kind==='a' ? 'var(--accent)' : kind==='g' ? 'var(--accent2)' : kind==='w' ? 'var(--warn)' : 'currentColor';
  var lines = String(txt).split('|'), out = '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="4" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1.4"/>';
  var y0 = y + h/2 - (lines.length-1)*7 + 4;
  lines.forEach(function(l, i){ out += lab(x+w/2, y0+i*14, l); });
  return out;
}
/* towers: cols = arrays of letters listed top to bottom. hi maps a letter to 'a' (accent), 'g' (green) or 'r' (red). */
function blocksSvg(cols, o){
  o = o || {};
  var s = 34, gap = (o.gap === undefined ? 30 : o.gap), pad = 14, hi = o.hi || {}, labels = o.labels || [];
  var n = cols.length, maxH = 1;
  cols.forEach(function(c){ if(c.length > maxH) maxH = c.length; });
  var capH = labels.length ? 18 : 0;
  var W = pad*2 + n*s + (n-1)*gap, H = pad*2 + maxH*s + 6 + capH, base = H - pad - capH;
  var out = svgOpen(W, H, o.aria || 'Towers of lettered blocks', o.maxw || Math.round(W*1.4));
  out += '<line x1="4" y1="'+(base+1)+'" x2="'+(W-4)+'" y2="'+(base+1)+'" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/>';
  cols.forEach(function(c, i){
    var x = pad + i*(s+gap);
    for(var j = 0; j < c.length; j++){
      var letter = c[c.length-1-j], y = base - (j+1)*s, k = hi[letter];
      var fill = k==='a' ? 'var(--accent-soft)' : k==='g' ? 'var(--accent2-soft)' : k==='r' ? 'var(--surface-2)' : 'var(--surface)';
      var stroke = k==='a' ? 'var(--accent)' : k==='g' ? 'var(--accent2)' : k==='r' ? 'var(--warn)' : 'currentColor';
      out += '<rect x="'+x+'" y="'+y+'" width="'+s+'" height="'+s+'" rx="2" fill="'+fill+'" stroke="'+stroke+'" stroke-width="'+(k?2:1.2)+'"/>';
      out += '<text x="'+(x+s/2)+'" y="'+(y+s/2+5)+'" text-anchor="middle" font-size="15" font-weight="600" style="fill:currentColor">'+letter+'</text>';
    }
    if(labels[i]) out += '<text x="'+(x+s/2)+'" y="'+(H-4)+'" text-anchor="middle" font-size="10" style="fill:var(--ink-faint)">'+labels[i]+'</text>';
  });
  return out + '</svg>';
}

PARTS.push({
  rail:'§2 Background',
  title:'The classical planning problem',
  bg:'To talk about plans precisely, the paper uses the textbook picture of a world: a list of facts that can be true or false, a few actions that change those facts, a starting situation and a target. Every later construct, from recognition to responsive plans, is a variation on this picture.',

  deep:[
    { title:'The tuple P = ⟨F, I, A, G⟩', html:
      '<div class="def-box"><span class="def-label">Classical planning problem (p. 2)</span><div class="def-formula">P = ⟨F, I, A, G⟩</div><div class="def-text"><b>F</b>: the set of propositional statements that define the world. <b>I ⊆ F</b>: the initial state, what is true now. <b>G ⊆ F</b>: the goal conditions that must all hold at the end. <b>A</b>: the actions the agent may perform.</div></div>'+
      '<div class="def-box"><span class="def-label">An action a ∈ A</span><div class="def-formula">a(s) = (s − Del(a)) ∪ Add(a) &nbsp;if&nbsp; Pre(a) ⊆ s</div><div class="def-text">Each action has <b>Pre(a) ⊆ F</b> (facts that must be true before it can run), <b>Add(a)</b> and <b>Del(a) ⊆ F</b> (facts it makes true and false), and a <b>cost c(a) &gt; 0</b>.</div></div>'+

PARTS.push({
  rail:'§2 Background',
  title:'Turning observations into a planning problem',
  bg:'A planner knows how to find plans, but not how to “check” that a plan contains certain observed actions in order. The trick is to add bookkeeping facts that record how many of the observed actions have been performed so far. Then asking for a plan that ends with the last bookkeeping fact forces the planner to perform the observed actions in order.',
  read: calloutRead('<b>p. 2 · §2 “Notation and problem statement.”</b> The formulas for P<sub>T</sub> and Add<sub>T</sub>.'),
  deep:[
    { title:'The new problem P<sub>T</sub>', html:
      '<div class="def-box"><span class="def-label">Observation-compiled problem (p. 2)</span><div class="def-formula">P<sub>T</sub> = ⟨F<sub>T</sub>, I<sub>T</sub>, A<sub>T</sub>, G⟩<br>F<sub>T</sub> = F ∪ { p<sub>i</sub> | 0 ≤ i ≤ |O| } &nbsp;&nbsp; I<sub>T</sub> = I ∪ {p<sub>0</sub>}<br>Add<sub>T</sub>(a) = Add(a) ∪ { p<sub>i−1</sub> → p<sub>i</sub> | a = o<sub>i</sub> ∈ O }</div><div class="def-text"><b>p<sub>i</sub></b> means “the i-th observed action has been seen”; <b>p<sub>0</sub></b> holds from the start. The effect <b>p<sub>i−1</sub> → p<sub>i</sub></b> is conditional: performing an action equal to o<sub>i</sub> while p<sub>i−1</sub> holds makes p<sub>i</sub> true. A<sub>T</sub> is A with only Add<sub>T</sub> changed.</div></div>'+
      fig(
        svgOpen(760, 100, 'A chain of facts p0, p1, p2 advanced by observed actions o1 and o2 in order.', 760)+
          box(30, 40, 90, 40, 'p₀|(start)', 'g')+arrow(120, 60, 250, 60, 'var(--accent)')+lab(185, 48, 'unstack H T', {color:'var(--accent)', size:10})+
          box(250, 40, 90, 40, 'p₁', 'g')+arrow(340, 60, 470, 60, 'var(--accent)')+lab(405, 48, 'put-down H', {color:'var(--accent)', size:10})+
          box(470, 40, 90, 40, 'p₂|(the last one)', 'g')+
          lab(185, 90, 'o₁ performed while p₀ holds', {size:10, color:'var(--ink-dim)'})+lab(405, 90, 'o₂ performed while p₁ holds', {size:10, color:'var(--ink-dim)'})+
          lab(640, 55, 'goal  G ∪ {p₂}', {bold:true, color:'var(--accent2)'})+lab(640, 71, 'forces both', {size:10, color:'var(--ink-dim)'})+
          '</svg>',
        'Each observed action can only advance the chain from the fact before it, so the observations must happen in order. Doing put-down H before unstack H T does not advance p₁.')+
      '<p class="lede dim">Other actions may happen between the observed ones. Only their <b>order</b> is enforced, so observations may be incomplete.</p>' },
    { title:'Conditional effects, concretely', html:
      '<p class="lede">An effect that only applies when a condition holds is called a <span class="gloss" tabindex="0" data-term="conditional-effect">conditional effect</span>. PDDL writes it with <code class="k">when</code>. For the first observed action, the compiled version of <code class="k">unstack(H,T)</code> looks like this:</p>'+
      '<div class="code-block"><span class="tag">unstack(H,T) after compilation, O = (unstack H T, put-down H)</span><pre><span class="kw">(:action</span> unstack-H-T\n  <span class="kw">:precondition</span> (and (on H T) (clear H) (handempty))\n  <span class="kw">:effect</span> (and <span class="add">(holding H) (clear T)</span>\n               <span class="del">(not (on H T)) (not (clear H)) (not (handempty))</span>\n               <span class="add">(when (p0) (p1))</span>))   <span class="kw">; new: advance the chain only from p0</span></pre></div>'+
      '<p class="lede dim">If the same action appears more than once in O, it simply gets one such conditional effect per position. Fast Downward, the planner used in the paper, supports conditional effects.</p>' }
  ],
  task: calloutTask('<p>O = (unstack(H,T), put-down(H), pick-up(H)). (a) List the new facts added to F and to the initial state. (b) For which actions does Add<sub>T</sub> differ from Add, and how? (c) If the planner performs put-down(H) <b>before</b> unstack(H,T), what happens to the chain?</p>'),
  answer: calloutAnswer('<ol><li>F gains <b>p₀, p₁, p₂, p₃</b>; the initial state gains <b>p₀</b>.</li><li>Only the three observed actions change: unstack(H,T) gets <b>p₀ → p₁</b>, put-down(H) gets <b>p₁ → p₂</b>, pick-up(H) gets <b>p₂ → p₃</b>.</li><li>Performing put-down(H) first: its conditional effect needs p₁, which is false, so nothing happens. The chain is stuck at p₀ until unstack(H,T) is done, then it can advance again. So the plan must perform the observed actions in order to ever reach p₃.</li></ol><p>Part 6 asks the planner for two different goals built from this chain.</p>'),
  recap:'<ul class="points"><li>Observations become facts <b>p₀ … p|O|</b>, advanced by conditional effects <b>p<sub>i−1</sub> → p<sub>i</sub></b>.</li><li>Reaching p|O| means the plan performed all observed actions, in order.</li><li>Other actions may be interleaved, so incomplete observations are fine.</li></ul>',
  journey:'2'
});
/* logistic curve P = 1 / (1 + e^(-beta * delta)), delta = c(G+notO) - c(G+O), drawn to scale */
function sigmoidChart(){
  var X0 = 60, XW = 420, Y0 = 170, YH = 130, beta = 1;
  function px(d){ return X0 + (d + 6) / 12 * XW; }
  function py(p){ return Y0 - p * YH; }
  var out = svgOpen(560, 215, 'Likelihood as a function of the cost gap between the two planner runs, beta equal to 1', 470);
  [0, 0.5, 1].forEach(function(p){
    out += '<line x1="'+X0+'" y1="'+py(p)+'" x2="'+(X0+XW)+'" y2="'+py(p)+'" stroke="currentColor" stroke-opacity=".15"/>'+lab(X0-8, py(p)+4, p.toFixed(1), {anchor:'end', size:10, color:'var(--ink-faint)'});
  });
  for(var d = -6; d <= 6; d += 2){
    out += '<line x1="'+px(d)+'" y1="'+Y0+'" x2="'+px(d)+'" y2="'+(Y0+4)+'" stroke="currentColor" stroke-opacity=".5"/>'+lab(px(d), Y0+16, (d > 0 ? '+' : '') + d, {size:10, color:'var(--ink-faint)'});
  }
  var pts = [];
  for(var k = -6; k <= 6.001; k += 0.25){ pts.push(px(k).toFixed(1)+','+py(1/(1+Math.exp(-beta*k))).toFixed(1)); }
  out += '<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2.4"/>';
  [[-4,'0.02'],[-2,'0.12'],[0,'0.50'],[4,'0.98']].forEach(function(m){
    var p = 1/(1+Math.exp(-beta*m[0]));
    out += '<circle cx="'+px(m[0])+'" cy="'+py(p)+'" r="4.5" style="fill:var(--accent2)"/>'+lab(px(m[0]) + (m[0] < 0 ? -8 : 8), py(p) + (m[0] < 0 ? -9 : 14), m[1], {anchor: m[0] < 0 ? 'end' : 'start', size:11, bold:true, color:'var(--accent2)'});
  });
  out += lab(X0+XW/2, 205, 'c(π*G+Ō) − c(π*G+O)   (positive: following O is cheaper than not)', {size:10.5, color:'var(--ink-dim)'});
  out += lab(14, 105, 'P(O|G)', {size:10.5, color:'var(--ink-dim)'}).replace('<text ', '<text transform="rotate(-90 14 105)" ');
  return out + '</svg>';
}

PARTS.push({
  rail:'§2 Background',
  title:'From two planner runs to a probability',
  bg:'The planner gives us costs, but a robot needs probabilities. The paper gets them with two ideas from statistics: Bayes’ rule, which says how to update a belief when evidence arrives, and a model of a person who is rational but not perfect. This part builds both up from scratch, because the rest of the paper leans on them.',
  read: calloutRead('<b>pp. 2–3 · §2 “Notation and problem statement,”</b> the last third (from “For each of goal conditions G ∈ 𝒢…”) to the end of the section on p. 3 with the formulas for P(O|G).'),
  deep:[
    { title:'Two planner runs per goal', html:
      '<p class="lede">For every candidate goal G the paper asks the planner two questions about the compiled problem P<sub>T</sub> from Part 5.</p>'+
      '<div class="two-col">'+
        '<div class="card"><h3>G + O  =  G ∪ {p<sub>|O|</sub>}</h3><p>Reach G <b>and</b> perform all the observed actions in order. The optimal cost is <b>c(π*<sub>G+O</sub>)</b>: “how much does G cost if I stay faithful to what I saw?”</p></div>'+
        '<div class="card"><h3>G + Ō  =  G ∪ {¬p<sub>|O|</sub>}</h3><p>Reach G <b>without</b> performing all the observed actions. The optimal cost is <b>c(π*<sub>G+Ō</sub>)</b>: “how much does G cost if I ignore what I saw?”</p></div>'+
      '</div>'+
      '<ul class="points"><li>If G is her real goal and she is rational, her actions are part of a cheapest plan, so staying faithful costs <b>no more</b> (the paper: c(π*<sub>G+O</sub>) &lt; c(π*<sub>G+Ō</sub>)).</li><li>If G is unrelated, doing O was wasted effort, so faithful is <b>more expensive</b> (c(π*<sub>G+O</sub>) &gt; c(π*<sub>G+Ō</sub>)).</li><li>When some cheapest plan for G happens to contain O anyway, the two costs are <b>equal</b>. That is the in-between case: O neither supports nor contradicts G.</li></ul>' },
    { title:'Bayes’ rule: updating a belief', html:
      '<div class="def-box"><span class="def-label">Bayes’ rule (p. 3)</span><div class="def-formula">P(G | O) = α<sup>−1</sup> · P(O | G) · P(G)</div><div class="def-text"><b>P(G)</b>, the <i>prior</i>: how likely each goal is before you see anything. <b>P(O | G)</b>, the <i>likelihood</i>: if G were the goal, how likely are these observations? <b>P(G | O)</b>, the <i>posterior</i>: the updated belief. <b>α</b> is a normalizing constant that makes the posteriors add up to 1.</div></div>'+
      '<div class="table-wrap"><table style="min-width:0;"><caption>Toy example: two goals, prior 0.5 each; the observation is 4× more likely under A</caption><thead><tr><th>Goal</th><th>Prior</th><th>Likelihood</th><th>Prior × likelihood</th><th>Posterior</th></tr></thead><tbody><tr><td class="approach">A</td><td>0.5</td><td>0.8</td><td>0.40</td><td><b>0.8</b></td></tr><tr><td class="approach">B</td><td>0.5</td><td>0.2</td><td>0.10</td><td><b>0.2</b></td></tr></tbody></table></div>'+
      '<p class="lede dim">A 50/50 belief becomes 80/20. A different prior would have given a different answer, which is why §4 later replaces the flat prior with a smarter one.</p>' },
    { title:'The likelihood: a rational but imperfect agent', html:
      '<div class="def-box"><span class="def-label">Likelihood (Ramírez &amp; Geffner; p. 3)</span><div class="def-formula">P(O | G) ≈ α′<sup>−1</sup> · exp(−β · c(π*<sub>G+O</sub>))<br>α′ = exp(−β · c(π*<sub>G+O</sub>)) + exp(−β · c(π*<sub>G+Ō</sub>))</div><div class="def-text">A <b>Boltzmann</b> (softmax) weight over “followed O” and “did not”: lower cost, higher probability. <b>β</b> is a fixed constant for how strictly we expect rationality.</div></div>'+
      fig(sigmoidChart(), 'With β = 1 only the cost gap matters: equal costs give 0.5, and each extra unit of wasted effort multiplies the odds by e⁻¹ ≈ 0.37. Drawn to scale from the formula.') }
  ],
  task: calloutTask('<p>Take β = 1 and a uniform prior over three goals X, Y, Z with these planner results: X: c(G+O) = 12, c(G+Ō) = 12. Y: c(G+O) = 14, c(G+Ō) = 12. Z: c(G+O) = 10, c(G+Ō) = 14. Compute the likelihood of each, then the posterior P(G|O).</p><p>Use P(O|G) = 1 / (1 + e<sup>−(c(G+Ō) − c(G+O))</sup>).</p>'),
  answer: calloutAnswer('<ol><li><b>X:</b> gap 0 → 0.50. <b>Y:</b> gap −2 → 1/(1+e²) = 0.12. <b>Z:</b> gap +4 → 1/(1+e<sup>−4</sup>) = 0.98.</li><li>Sum = 1.60. Posterior: <b>X ≈ 0.31, Y ≈ 0.07, Z ≈ 0.61</b>.</li></ol><p>Z wins because every one of its cheapest plans <i>requires</i> the observed actions (following O saves 4). Y loses because O is a detour for it. X is in between. This is the engine of recognition; Part 7 turns the resulting distribution into something a helper can plan from.</p>'),
  recap:'<ul class="points"><li>Per goal, two optimal-cost runs: <b>G+O</b> (stay faithful to the observations) and <b>G+Ō</b> (ignore them).</li><li><b>Bayes’ rule</b>: posterior ∝ likelihood × prior, normalized to sum to 1.</li><li>The likelihood is a <b>Boltzmann</b> weight on the two costs, so only the <b>cost gap</b> matters; β sets how strict we are.</li></ul>',
  journey:'2'
});

PARTS.push({
  rail:'§3 Response',
  title:'Definition 1: necessity',
  bg:'Once the robot has a probability for each goal, it still has to decide what to do. Choosing only the single most likely goal throws information away: even when two goals are tied, they may share most of their conditions. The paper keeps that information with a score for each fact, saying how strongly the fact is needed.',
  read: calloutRead('<b>p. 3 · §3 “Deriving an Interactive Response,” Definition 1 (Necessity)</b> and the two sentences after it (the threshold τ and Ĝ<sub>Red</sub>).'),
  deep:[
    { title:'N(p | O) and the threshold τ', html:
      '<div class="def-box"><span class="def-label">Definition 1. Necessity</span><div class="def-formula">N(p ∈ F | O) = Σ<sub>G ∈ 𝒢</sub> P(G | O) · 𝟙(p ∈ G)</div><div class="def-text">The expected probability that p is a goal condition, given the observations. 𝟙 is the <span class="gloss" tabindex="0" data-term="indicator-function">indicator function</span>: 1 if p is in G, otherwise 0. N = 1 means every goal with positive probability needs p; N = 0 means none does.</div></div>'+
      '<div class="def-box"><span class="def-label">The estimated goal of R<sub>ed</sub></span><div class="def-formula">Ĝ<sub>Red</sub> = { p | N(p | O) ≥ τ }</div><div class="def-text">For a chosen threshold τ, keep the conditions that are necessary enough. These are the facts R<sub>ing</sub> will assume R<sub>ed</sub> is trying to make true.</div></div>' },
    { title:'Worked example: MASTER or FASTER', html:
      '<p class="lede">Suppose the recognizer says MASTER 0.5, FASTER 0.5. Each word is a tower, top to bottom, so its goal conditions are “X on Y” pairs plus “R on the table”.</p>'+
      fig(
        svgOpen(640, 210, 'Bar chart of necessity for each goal condition with thresholds', 640)+
          [['on(A,S)',1],['on(S,T)',1],['on(T,E)',1],['on(E,R)',1],['ontable(R)',1],['on(M,A)',0.5],['on(F,A)',0.5]].map(function(r, i){
            var y = 14 + i*26;
            return lab(120, y+13, r[0], {anchor:'end', size:11})+'<rect x="130" y="'+y+'" width="'+(r[1]*400)+'" height="18" rx="2" style="fill:'+(r[1] === 1 ? 'var(--accent2)' : 'var(--accent)')+'" opacity=".85"/>'+lab(136+r[1]*400, y+13, r[1].toFixed(1), {anchor:'start', size:11, bold:true});
          }).join('')+
          '<line x1="'+(130+0.6*400)+'" y1="6" x2="'+(130+0.6*400)+'" y2="200" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="5 4"/>'+lab(130+0.6*400+5, 198, 'τ = 0.6', {anchor:'start', color:'var(--warn)', bold:true})+
          '</svg>',
        'The five conditions shared by both words have N = 1; “M on A” and “F on A” have N = 0.5. With τ = 0.6 (my choice for the example) only the shared five survive. The paper uses τ = 0.3, which would also keep the two conflicting ones.')+
      '<p class="lede dim">“M on A” and “F on A” cannot both hold, because a block can have only one block directly on it. A set Ĝ<sub>Red</sub> that contains both has no solution, so the threshold matters.</p>' }
  ],
  task: calloutTask('<p>Posterior: HER 0.5, HATER 0.3, OTHER 0.2. Goal conditions (top to bottom): HER = on(H,E), on(E,R), ontable(R). HATER = on(H,A), on(A,T), on(T,E), on(E,R), ontable(R). OTHER = on(O,T), on(T,H), on(H,E), on(E,R), ontable(R).</p><p>(a) Compute N for each distinct condition. (b) What is Ĝ<sub>Red</sub> for τ = 0.5? (c) For τ = 0.25, what goes wrong?</p>'),
  answer: calloutAnswer('<ol><li><b>N(on(E,R)) = N(ontable(R)) = 1.0</b> (all three words). <b>N(on(H,E)) = 0.5 + 0.2 = 0.7</b> (HER and OTHER). <b>N(on(H,A)) = N(on(A,T)) = N(on(T,E)) = 0.3</b> (HATER only). <b>N(on(O,T)) = N(on(T,H)) = 0.2</b> (OTHER only).</li><li>τ = 0.5: <b>Ĝ<sub>Red</sub> = {on(H,E), on(E,R), ontable(R)}</b>, a consistent tower H on E on R.</li><li>τ = 0.25 also keeps on(H,A), on(A,T), on(T,E). But on(T,E) and on(H,E) both put a block directly on E, so the conditions <b>conflict</b> and no plan can satisfy all of them. This is exactly what the paper’s example shows for small τ.</li></ol><p>Parts 8 to 10 now use Ĝ<sub>Red</sub> to build the helper’s planning problem in three different ways.</p>'),
  recap:'<ul class="points"><li><b>Necessity</b> N(p|O) = the probability-weighted fraction of candidate goals that need p.</li><li>Ĝ<sub>Red</sub> keeps the conditions with N ≥ τ: the helper’s guess at what R<sub>ed</sub> wants.</li><li>Too small a τ can keep <b>conflicting</b> conditions, which makes the next planning problem unsolvable.</li></ul>',
  journey:'3'
});

PARTS.push({
  rail:'§3 Response',
  title:'Definition 2: assistive interaction',
  bg:'The simplest way for a robot to respond is to adopt the person’s goals as its own. If it thinks she is trying to make certain facts true, it plans how the two of them, working together, can make those facts true fastest.',

  title:'Lemma 1: a helper that knows the goal cannot hurt',
  bg:'If the robot knew her goal exactly, and its own actions never interfere with the things her plan needs, it should never do harm. This lemma says exactly that. It gives a guarantee that helpfulness is at least zero in the friendly cases.',

  deep:[
    { title:'Statement and proof sketch', html:
      '<div class="def-box"><span class="def-label">Lemma 1 (p. 4)</span><div class="def-formula">If R<sub>ing</sub> knows G, R<sub>ing</sub> is assistive or independent, and there is a <i>non-invasive</i> sequence of actions such that R<sub>ing</sub> never affects a precondition of any action in π*<sub>G</sub>, then H(π<sub>Ring</sub>) ≥ 0.</div></div>'+
      '<ol class="points" style="counter-reset:s;"><li><b>Knowing G:</b> G<sub>Ring</sub> = G, so P<sub>Ring</sub> and P<sub>Red←Ring</sub> are the same problem (the extra facts and action changes only force R<sub>ing</sub> to follow her plan). Hence π*<sub>G<sub>Ring</sub></sub> = π*<sub>G+π<sub>Ring</sub></sub>.</li><li><b>A harmless fallback exists:</b> R<sub>ing</sub> could at least perform the non-invasive sequence as π<sub>Ring</sub> while R<sub>ed</sub> performs her original plan. That joint solution costs no more than R<sub>ed</sub> alone: c(π*<sub>G+π<sub>Ring</sub></sub>) ≤ c(π*<sub>G,≥now</sub>).</li><li><b>Therefore</b> H(π<sub>Ring</sub>) = c(π*<sub>G,≥now</sub>) − c(π<sub>Red←Ring</sub>) ≥ 0. ∎</li></ol>' },
    { title:'What “non-invasive” means', html:

/* ---- statistics helpers for §4 (the paper's shifted positive Poisson and survival function) ---- */
function pmfShift(x, c, lam){
  if(x < c) return 0;
  var k = x - c + 1, l = lam + 1, f = 1;
  for(var i = 2; i <= k; i++) f *= i;
  return Math.pow(l, k) / (f * (Math.exp(l) - 1));
}
function survivalAt(tp, c, lam){
  if(tp <= c) return 1;
  var s = 0;
  for(var x = c; x < tp; x++) s += pmfShift(x, c, lam);
  return Math.max(1 - s, 1e-9);
}
function survivalChart(c, lam){
  var X0 = 60, XW = 440, Y0 = 160, YH = 120, t0 = c - 1, t1 = c + 8, n = t1 - t0;
  function px(t){ return X0 + (t - t0) / n * XW; }
  function py(p){ return Y0 - p * YH; }
  var out = svgOpen(560, 205, 'Bars show the probability that the real plan cost equals t; the line shows the survival probability that the plan is still running at t.', 520);
  [0, 0.5, 1].forEach(function(p){
    out += '<line x1="'+X0+'" y1="'+py(p)+'" x2="'+(X0+XW)+'" y2="'+py(p)+'" stroke="currentColor" stroke-opacity=".15"/>'+lab(X0-8, py(p)+4, p.toFixed(1), {anchor:'end', size:10, color:'var(--ink-faint)'});
  });
  var pts = [];
  for(var t = t0; t <= t1; t++){
    out += lab(px(t), Y0+16, String(t), {size:10, color:'var(--ink-faint)'});
    var pm = pmfShift(t, c, lam);
    if(pm > 0) out += '<rect x="'+(px(t)-11)+'" y="'+py(pm)+'" width="22" height="'+(pm*YH)+'" style="fill:var(--accent)" opacity=".55"/>';
    var s = survivalAt(t, c, lam);
    pts.push(px(t).toFixed(1)+','+py(s).toFixed(1));
  }
  out += '<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--accent2)" stroke-width="2.4"/>';
  for(var u = t0; u <= t1; u++){
    var sv = survivalAt(u, c, lam);
    out += '<circle cx="'+px(u)+'" cy="'+py(sv)+'" r="3.6" style="fill:var(--accent2)"/>';
    if(u >= c + 1 && u <= c + 5) out += lab(px(u)+4, py(sv)-8, sv.toFixed(2), {anchor:'start', size:10.5, bold:true, color:'var(--accent2)'});
  }
  out += lab(X0+XW/2, 198, 'resource spent t  (here: actions)   bars: P(c(π) = t | G)   line: survival P(t | G)', {size:10.5, color:'var(--ink-dim)'});
  return out + '</svg>';
}
function priorChart(eps, lam){
  var goals = [['HER', 6, 'var(--accent)'], ['FOSTER', 12, 'var(--accent2)'], ['MASTER', 16, 'var(--ink)']];
  var X0 = 60, XW = 400, Y0 = 160, YH = 130, TMAX = 14, PMAX = 1;
  function px(t){ return X0 + t / TMAX * XW; }
  function py(p){ return Y0 - p / PMAX * YH; }
  var out = svgOpen(640, 205, 'Normalized prior of three goals over time with foresight ' + eps, 600);
  [0, 0.5, 1].forEach(function(p){
    out += '<line x1="'+X0+'" y1="'+py(p)+'" x2="'+(X0+XW)+'" y2="'+py(p)+'" stroke="currentColor" stroke-opacity=".15"/>'+lab(X0-8, py(p)+4, p.toFixed(2), {anchor:'end', size:10, color:'var(--ink-faint)'});
  });
  for(var t = 0; t <= TMAX; t += 2) out += lab(px(t), Y0+16, String(t), {size:10, color:'var(--ink-faint)'});
  goals.forEach(function(g, gi){
    var pts = [];
    for(var t = 0; t <= TMAX; t++){
      var z = 0; goals.forEach(function(h){ z += survivalAt(t + eps, h[1], lam); });
      pts.push(px(t).toFixed(1)+','+py(survivalAt(t + eps, g[1], lam) / z).toFixed(1));
    }
    out += '<polyline points="'+pts.join(' ')+'" fill="none" style="stroke:'+g[2]+'" stroke-width="2.4"/>';
    out += '<line x1="480" y1="'+(40+gi*20)+'" x2="504" y2="'+(40+gi*20)+'" style="stroke:'+g[2]+'" stroke-width="2.4"/>'+lab(510, 44+gi*20, g[0]+' (c* = '+g[1]+')', {anchor:'start', size:10.5, bold:true, color:g[2]});
  });
  out += lab(X0+XW/2, 198, 'actions seen so far, t   (ε = '+eps+', λ = '+lam+', equal likelihoods)', {size:10.5, color:'var(--ink-dim)'});
  return out + '</svg>';
}

PARTS.push({
  rail:'§4 Foresight',
  title:'Survival analysis and the positive Poisson',
  bg:'To say how likely a plan is to still be running, you need a model of how long plans take. The paper borrows two tools from statistics: the Poisson distribution, for counting extra effort, and survival analysis, the statistics of how long something lasts. This part builds both slowly, with the paper’s exact formulas.',
  read: calloutRead('<b>p. 5 · the text after Definition 6,</b> from “Clearly any plan for some goal G ∈ 𝒢 must survive…” to the end of the survival-function paragraph. The formulas are on the right-hand side of the page.'),
  deep:[
    { title:'Counting extra effort: the Poisson distribution', html:
      '<p class="lede">A plan for G needs at least c(π*<sub>G</sub>) actions. A real agent may spend some <b>additional</b> discrete amount k: detours, mistakes, re-doing. The paper treats k as a count of events in a fixed window (one execution of the plan), and counts of events are modeled by the <b>Poisson distribution</b>:</p>'+
      '<div class="def-box"><span class="def-label">Poisson distribution</span><div class="def-formula">Poisson(k; λ) = λ<sup>k</sup> / ( k! · e<sup>λ</sup> ), &nbsp; k = 0, 1, 2, …</div><div class="def-text">λ is both the expected count and the standard deviation. A usually optimal agent should have a small λ; a sloppier agent, a larger one.</div></div>'+
      '<div class="table-wrap"><table style="min-width:0;"><caption>Example with λ = 2</caption><thead><tr><th>k extra actions</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead><tbody><tr><td class="approach">P(k)</td><td>0.135</td><td>0.271</td><td>0.271</td><td>0.180</td><td>0.090</td><td>0.036</td></tr></tbody></table></div>' },
    { title:'A distribution that starts at 1: the positive Poisson', html:
      '<p class="lede">The paper wants “usually optimal” to be possible, but plain Poisson with λ = 0 gives 0 for every k ≥ 1. So it uses the <b>positive Poisson</b> (Singh 1978): the Poisson with k = 0 removed and the rest rescaled to add up to 1.</p>'+
      '<div class="def-box"><span class="def-label">Positive Poisson</span><div class="def-formula">Poisson<sup>+</sup>(k; λ) = λ<sup>k</sup> / ( k! · (e<sup>λ</sup> − 1) ), &nbsp; k = 1, 2, 3, …</div><div class="def-text">Why e<sup>λ</sup> − 1? Because Σ<sub>k≥1</sub> λ<sup>k</sup> / k! = e<sup>λ</sup> − 1, so dividing by it makes the total exactly 1.</div></div>'+
      '<div class="def-box"><span class="def-label">The paper’s distribution of the real plan cost (p. 5)</span><div class="def-formula">P(c(π) = t | G) = 0 &nbsp; if t &lt; c(π*<sub>G</sub>);<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; = (λ+1)<sup>t−c(π*<sub>G</sub>)+1</sup> / ( (t−c(π*<sub>G</sub>)+1)! · (e<sup>λ+1</sup> − 1) ) &nbsp; otherwise</div><div class="def-text">Shift: k = (t − c(π*<sub>G</sub>)) + 1, so the optimal cost corresponds to k = 1, and λ is increased to λ + 1 to compensate for the removed zero.</div></div>' },
    { title:'Survival and hazard', html:
      '<div class="def-box"><span class="def-label">Survival function (p. 5)</span><div class="def-formula">P(t | G) = P(c(π) ≥ t | G) = 1 − cdf<sub>t</sub>( c(π) | G )</div><div class="def-text">The probability that the plan is <b>still running</b> when t units have been spent. cdf is the cumulative distribution function: the probability of having ended before t. The <b>hazard function</b> h(t) = P(c(π) = t | G) / P(c(π) ≥ t | G) says how likely the plan is to end exactly now, given that it has lasted this long, which could tell the robot that R<sub>ed</sub> is almost finished.</div></div>'+
      fig(survivalChart(6, 1), 'For c(π*<sub>G</sub>) = 6 and λ = 1 (my example value; the paper gives none): bars are the cost distribution, the line is the survival. Survival is 1 up to the optimal cost, then falls fast: 0.69 at 7, 0.37 at 8, 0.17 at 9.') }
  ],
  task: calloutTask('<p>With λ = 1 and c(π*<sub>G</sub>) = 6, use the paper’s formula to compute P(c(π) = 8) and the survival P(t = 9 | G) (use e<sup>2</sup> − 1 ≈ 6.389 and the probabilities for costs 6, 7 and 8).</p>'),
  answer: calloutAnswer('<ol><li>λ+1 = 2. For cost 8: k = 8 − 6 + 1 = 3, so P = 2<sup>3</sup> / (3! · 6.389) = 8 / 38.33 = <b>0.209</b>. Cost 6: k = 1, 2/6.389 = 0.313; cost 7: k = 2, 4/(2 · 6.389) = 0.313.</li><li>Survival at 9 = 1 − (0.313 + 0.313 + 0.209) = <b>0.165</b>: only a 16.5% chance that a goal-6 plan is still going after 9 actions.</li></ol><p>That is the number that will weaken a cheap goal in the prior. Part 20 pins down what “still running” means precisely.</p>'),
  recap:'<ul class="points"><li>The extra effort beyond optimal is modeled as a (<b>positive</b>) <b>Poisson</b> count, shifted so the optimal cost is the smallest possible value.</li><li>The <b>survival function</b> P(t|G) = P(cost ≥ t) is the chance the plan is still running at t.</li><li>The paper does not fix λ; it controls how forgiving the model is of detours.</li></ul>',
  journey:'4'
});

PARTS.push({
  rail:'§4 Foresight',
  title:'Definition 6: in-progress and maintaining plans',
  bg:'“Is the plan still running?” needs a precise meaning. The paper defines it through the goal conditions: a plan is running until the goal is satisfied. It also rules out plans that go on doing things after the goal is already true.',
  read: calloutRead('<b>p. 5 · Definition 6 (in-progress) and the paragraph below it</b>, right-hand column.'),
  deep:[
    { title:'Definition 6', html:
      '<div class="def-box"><span class="def-label">Definition 6 (p. 5)</span><div class="def-formula">A plan π that successfully solves a planning problem with goal G is <b>in-progress</b> at step i if G’s conditions are not yet satisfied after performing π<sub>≤i</sub>. If π<sub>≥j</sub>, for j &lt; |π|, is no longer in-progress, then π<sub>≥j</sub> is <b>maintaining</b>.</div></div>'+
      fig(
        svgOpen(700, 150, 'A plan of six steps. It is in progress for steps one to five and ends when the goal is satisfied at step six. A maintaining tail would continue after the goal holds.', 700)+
          [1,2,3,4,5,6].map(function(i){ return box(40+(i-1)*70, 30, 58, 34, 'step '+i, i < 6 ? 'a' : 'g'); }).join('')+
          '<rect x="460" y="30" width="58" height="34" rx="4" fill="none" stroke="var(--warn)" stroke-dasharray="5 4"/>'+lab(489, 52, 'step 7', {color:'var(--warn)'})+
          '<rect x="530" y="30" width="58" height="34" rx="4" fill="none" stroke="var(--warn)" stroke-dasharray="5 4"/>'+lab(559, 52, 'step 8', {color:'var(--warn)'})+
          lab(190, 96, 'in-progress: G not yet satisfied', {color:'var(--accent)', bold:true})+lab(401, 96, 'G holds', {color:'var(--accent2)', bold:true})+
          lab(525, 96, 'maintaining (excluded)', {color:'var(--warn)'})+
          '</svg>',
        'The paper only considers plans that stop as soon as G is satisfied. Anything after that point would be “maintaining”.')+
      '<ul class="points"><li>A plan <b>survives as long as it is in-progress</b> and ceases once G holds.</li><li>Any plan for G must survive at least c(π*<sub>G</sub>) steps, because the optimal plan is the cheapest possible.</li></ul>' }
  ],
  task: calloutTask('<p>For HER (optimal cost 6) in the paper’s start state, a person takes 8 actions and then stops. (a) At which step does the plan stop being in-progress? (b) Is the minimum survival time of this plan 6 or 8? (c) Would a robot arm that keeps holding the finished tower to stop it falling over be “maintaining”?</p>'),
  answer: calloutAnswer('<ol><li>It stops being in-progress at step 8, the step after which all of HER’s goal conditions hold.</li><li>Any plan for HER must survive at least <b>6</b> steps; this person’s plan survived 8 because she wasted 2.</li><li><b>Yes</b>: continuing to act after G is satisfied is maintaining behavior, which the paper excludes from its model.</li></ol><p>With the meaning of “in progress” fixed, the last piece, foresight itself, is in Part 21.</p>'),
  recap:'<ul class="points"><li>A plan is <b>in-progress</b> while its goal conditions are not yet satisfied.</li><li>Actions after G holds would be <b>maintaining</b>; the paper’s model ignores them.</li><li>Survival of a plan for G is therefore at least c(π*<sub>G</sub>).</li></ul>',
  journey:'4'
});

PARTS.push({
  rail:'§4 Foresight',
  title:'Foresight: the parameter ε',
  bg:'Survival tells us how likely a plan is to still be running now. For a robot that has to decide before the end, it is better to ask the question a few steps ahead. The foresight parameter ε does exactly that.',
  read: calloutRead('<b>pp. 5–6 · the last paragraph of §4,</b> at the top of the left-hand column of p. 6, starting “Instead of using the hazard function, we will use just the survival function with <i>foresight</i>…”.'),
  deep:[
    { title:'Using t + ε in the prior', html:
      '<div class="def-box"><span class="def-label">Foresight (p. 5)</span><div class="def-formula">prior at time t + ε &nbsp;(ε ≥ 0): &nbsp; P(G | t + ε) ∝ P(t + ε | G) · P(G)</div><div class="def-text">Because the likelihood prefers goals that will not consume many more resources than t, the prior is computed at the <b>future</b> time t + ε. If goals’ optimal costs vary enough, this bypasses the goals the likelihood favors and moves probability toward long-term goals that cannot yet be achieved.</div></div>'+
      '<p class="lede">What ε should be depends on three things the paper lists: the <b>variation</b> in the goals’ optimal plan costs, the <b>time already elapsed</b> (if t becomes too large, every goal is surpassed and the prior becomes uniform again), and how much <b>look-ahead</b> you want for interaction.</p>' },
    { title:'The effect on three goals', html:
      fig(priorChart(3, 1), 'My illustration, not a figure from the paper: three goals from the example (HER 6, FOSTER 12, MASTER 16), ε = 3, λ = 1 (an assumed value), and equal likelihoods so that only the prior acts. HER fades early; FOSTER fades later; MASTER is still alive at the end.')+
      '<p class="lede dim">With ε = 0 the same curves would start falling three steps later. A larger ε makes the prior commit to the long-term goal earlier, which is what the paper exploits in §5 (it uses ε = 3, and shows panels for ε = 0, 1, 3 and 6).</p>' }
  ],
  task: calloutTask('<p>Take λ = 1, a goal FOSTER with c(π*<sub>G</sub>) = 12, and t = 8. Compute the survival value used in the prior for ε = 0, 3 and 6. Then compare the ε = 6 value with that of MASTER (c = 16).</p>'),
  answer: calloutAnswer('<ol><li>ε = 0: t′ = 8 ≤ 12, survival <b>1.0</b>. ε = 3: t′ = 11 ≤ 12, survival <b>1.0</b>.</li><li>ε = 6: t′ = 14. Survival = 1 − P(12) − P(13) = 1 − 0.313 − 0.313 = <b>0.374</b>.</li><li>MASTER at t′ = 14: 14 ≤ 16, survival <b>1.0</b>. So at ε = 6 the prior favors MASTER over FOSTER by about 2.7 to 1, while at ε = 0 or 3 the two are still tied.</li></ol><p>A bigger ε separates costly goals from cheap ones sooner, at the price of trusting the model of “how long plans take” more. In §5 the paper tests ε on its Block-words example.</p>'),
  recap:'<ul class="points"><li>Foresight evaluates the survival prior at <b>t + ε</b> instead of t, so cheap goals lose weight earlier.</li><li>What ε works depends on cost variation, elapsed time and the desired look-ahead.</li><li>Cost: the more you trust the duration model, the earlier you commit.</li></ul>',
  journey:'4'
});

function paperFig(id, alt, page, cap){
  return '<figure class="diagram-wrap"><span class="tag">as printed in the paper · p. '+page+'</span>'+
    '<img src="'+FIGDATA[id]+'" alt="'+alt+'" style="display:block;max-width:100%;width:auto;max-height:32vh;margin:.4rem 0 0;border:1px solid var(--grid);border-radius:6px;background:#fff;padding:.5rem;"/>'+
    '<figcaption>'+cap+'</figcaption></figure>';
}
var GOAL_COSTS = [['HER',6,2],['OTHER',16,6],['BOTHER',22,10],['MOTHER',18,6],['FATHER',18,8],['LATHER',18,8],['MASTER',16,8],['FASTER',16,8],['FOSTER',12,6],['HATER',12,6],['LATER',12,6],['WATER',12,6]];
function costTable(){
  var rows = GOAL_COSTS.map(function(r){
    var b = r[0] === 'MASTER';
    return '<tr><td class="approach">'+(b ? '<b>'+r[0]+'</b>' : r[0])+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>'+(r[1]/r[2]).toFixed(1)+'×</td></tr>';
  }).join('');
  return '<div class="table-wrap"><table style="min-width:0;font-size:.74rem;"><caption>Numbers printed in Fig. 1 (left); the last column is my division</caption><thead><tr><th>Goal word</th><th>c(π*<sub>G</sub>), one agent</th><th>c(π*<sub>Red+Ring</sub>), two agents</th><th>speed-up</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

PARTS.push({
  rail:'§5 Example',
  title:'The Block-words setup (Fig. 1)',
  bg:'The paper tests its ideas on a puzzle: lettered blocks that two robot arms can stack to spell words. Before looking at what happens, you need to see the table, the twelve target words, and the rules for how two arms can share a table.',
  read: calloutRead('<b>p. 6 · §5 “Illustrated Example,”</b> the first paragraph (left-hand column) and <b>Figure 1</b> at the top of the page. Footnote 1 explains why the authors built their own domain.'),
  deep:[
    { title:'The start state and the twelve goals', html:
      paperFig('FIG1', 'Figure 1 of the paper: the start state with three towers, the list of twelve goal words with two costs each, and two states from the assistive example.', 6, 'Figure 1: <i>Left</i> Initial state and goals with c(π*<sub>G</sub>) and c(π*<sub>Red+Ring</sub>). <i>Right</i> States where assistive interaction begins and ends. The bold word, MASTER, is the goal R<sub>ed</sub> is actually pursuing.')+
      '<ul class="points"><li>Three towers, top to bottom: <b>H-T-E-R</b>, <b>L-S-M-O</b>, <b>F-W-B-A</b>. Each word reads top to bottom, as in Part 3.</li><li>The two numbers after each word are the optimal cost for one agent (the one used so far) and for the two arms working together.</li></ul>' },
    { title:'How two arms share a table', html:
      '<p class="lede">The authors extend Block-words for two agents (p. 6): all actions of A<sub>Red+Ring</sub> are performed <b>in parallel</b> when different blocks are involved, but actions that share blocks are modified into <b>joint actions</b>.</p>'+
      fig(
        svgOpen(700, 130, 'Two lanes showing a handover, where one arm puts down a block as the other picks it up in the same step, and a stack pair, where two stacked blocks are lifted together.', 700)+

  task: calloutTask('<p>Using the table: (a) which goal has the largest saving in <b>absolute</b> steps from a second agent? (b) Which has the largest speed-up factor? (c) A second arm can do two things at once, so why is the speed-up for HER and MOTHER three times, not two?</p>'),
  answer: calloutAnswer('<ol><li><b>BOTHER:</b> 22 → 10 saves 12 steps.</li><li><b>HER and MOTHER</b> at 3.0× (6 → 2 and 18 → 6). The other words are between 2.0× and 2.7×.</li><li>Two arms working in parallel could at best halve the cost. A 3× gain needs the joint actions as well: handovers and lifting two stacked blocks as a pair do work that one arm needs several steps for. That is my reading of the paper’s joint-action rules; the paper does not break down these counts.</li></ol><p>The hidden goal in the walkthrough is MASTER, where 16 becomes 8. Part 23 follows it step by step.</p>'),

var GLOSSARY = {
  'plan-recognition': 'Working out what an agent is doing, or trying to achieve, from the actions you have seen it take.',
  'strips': 'A classic planning model (Fikes and Nilsson, 1971): a state is a set of facts, and each action has preconditions, an add list and a delete list.',
  'pddl': 'Planning Domain Definition Language: a standard text format for writing a planning domain and problem so that a planner can read it.',
  'conditional-effect': 'An action effect that only happens if some extra condition holds when the action is performed. PDDL writes it as (when condition effect).',
  'indicator-function': 'A function that returns 1 when a statement is true and 0 when it is false. It lets a condition be used inside a sum.',
  'no-op': 'An action that changes nothing. In joint actions it lets one agent wait while the other acts.',
  'fast-downward': 'A widely used open-source classical planner (Helmert, 2006). It searches for plans with heuristics and reads PDDL.',
  'landmark': 'A fact that must become true at some point in every plan for a goal. Landmarks split a hard planning problem into easier subgoals.',
  'goal-recognition-design': 'Redesigning an environment so that an observer can tell an agent’s goals apart as early as possible.',
  'off-the-shelf-planner': 'An existing general-purpose planner used unchanged, with no special solver written for the new problem.',
  'precondition': 'A fact that must be true before an action can be performed.',
  'pspace-complete': 'A hardness class: problems solvable with a polynomial amount of memory, but possibly exponential time. Classical planning is in this class.',
};
/* ============ END EDIT PER PAPER: glossary ============ */

function calloutRead(text){ return '<div class="callout read"><span class="callout-label">Read now</span><p>'+text+'</p></div>'; }
function calloutTask(html){ return '<div class="callout task"><span class="callout-label">Try it</span>'+html+'</div>'; }
function calloutAnswer(html){ return '<div class="callout answer"><span class="callout-label">Answer &amp; discussion</span>'+html+'</div>'; }

function slideShell(rail, stepTag, bodyHtml, top){
  return { rail: rail, html:
    '<span class="eyebrow">'+rail+' <span class="step-tag">'+stepTag+'</span></span>'+
    '<div class="slide-body'+(top?' top':'')+'">'+bodyHtml+'</div>'
  };
}

function initGlossary(){
  var tip = document.createElement('div');
  tip.className = 'gloss-tip';
  document.body.appendChild(tip);
  var current = null;
  function place(el){
    var r = el.getBoundingClientRect();
    var left = Math.max(8, Math.min(window.innerWidth - 288, r.left));
    var top = r.bottom + 8;
    if(top + 90 > window.innerHeight) top = Math.max(8, r.top - 8 - tip.offsetHeight);
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  }
  function show(el){
    var term = el.dataset.term;
    var def = GLOSSARY[term];
    if(!def) return;
    tip.innerHTML = '<b>'+term.replace(/-/g,' ')+'</b>'+def;
    tip.classList.add('show');
    current = el;
    place(el);
  }
  function hide(){ tip.classList.remove('show'); current = null; }
  document.addEventListener('mouseover', function(e){ var el = e.target.closest && e.target.closest('.gloss'); if(el) show(el); });
  document.addEventListener('mouseout', function(e){
    var el = e.target.closest && e.target.closest('.gloss');
    if(el && (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('.gloss'))) hide();
  });
  document.addEventListener('focusin', function(e){ var el = e.target.closest && e.target.closest('.gloss'); if(el) show(el); });
  document.addEventListener('focusout', function(e){ var el = e.target.closest && e.target.closest('.gloss'); if(el) hide(); });
  document.addEventListener('click', function(e){
    var el = e.target.closest && e.target.closest('.gloss');
    if(el){ if(current===el) hide(); else show(el); }
    else if(current){ hide(); }
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') hide(); });
  document.addEventListener('scroll', hide, true);
  window.addEventListener('resize', function(){ if(current) place(current); });
}

function buildPart(p){
  var out = [];
  out.push(slideShell(p.rail, 'Background &amp; Reading',
    '<h2 class="slide-title">'+p.title+'</h2><p class="lede">'+p.bg+'</p>'+p.read));
  var deeps = p.deep.length ? p.deep : [p.deep];
  deeps.forEach(function(d,i){
    var tag = deeps.length>1 ? 'Deep Dive '+(i+1)+'/'+deeps.length : 'Deep Dive';
    out.push(slideShell(p.rail, tag, '<h2 class="slide-title">'+(d.title||p.title)+'</h2>'+d.html));
  });
  if(p.task) out.push(slideShell(p.rail, 'Try It', '<h2 class="slide-title">Try it</h2>'+p.task));
  if(p.answer) out.push(slideShell(p.rail, 'Answer &amp; Discussion', '<h2 class="slide-title">Working through it</h2>'+p.answer));
  out.push(slideShell(p.rail, 'Recap', '<h2 class="slide-title" style="font-size:1.6rem;">Recap</h2>'+p.recap+'<div class="journey" data-active="'+p.journey+'"></div>', true));
  return out;
}

      parts.push('<text x="'+xs[i]+'" y="'+(y+26)+'" text-anchor="middle" font-size="11" fill="var(--ink-dim)">'+sec.key+'</text>');
      sec.label.split('\n').forEach(function(line,li){
        parts.push('<text x="'+xs[i]+'" y="'+(y+40+li*11)+'" text-anchor="middle" font-size="9" fill="var(--ink-faint)">'+line+'</text>');
      });
      if(isActive) parts.push('<text x="'+xs[i]+'" y="'+(y-16)+'" text-anchor="middle" font-size="9" fill="var(--accent)" font-weight="700">YOU ARE HERE</text>');
    });
    el.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Progress map of the paper sections, highlighting the current section.">'+parts.join('')+'</svg>';
  }
  document.querySelectorAll('.journey').forEach(renderJourney);

  var slides = Array.from(document.querySelectorAll('.slide'));
  var rail = document.getElementById('rail');
  var fill = document.getElementById('fill');
  var counter = document.getElementById('counter');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var idx = 0;

  var groups = [];
  slides.forEach(function(s){ var g=s.dataset.rail; if(groups.indexOf(g)===-1) groups.push(g); });
  var groupFirstIndex = {};
  slides.forEach(function(s,i){ var g=s.dataset.rail; if(!(g in groupFirstIndex)) groupFirstIndex[g]=i; });
  groups.forEach(function(g){
    var b = document.createElement('button');
    b.setAttribute('aria-label', g); b.title = g; b.dataset.group = g;
    b.addEventListener('click', function(){ go(groupFirstIndex[g]); });
    rail.appendChild(b);
  });
  var railBtns = Array.from(rail.children);

  function render(){
    slides.forEach(function(s,i){ s.classList.toggle('active', i===idx); });
    fill.style.width = (idx/(slides.length-1)*100) + '%';
    counter.textContent = (idx+1) + ' / ' + slides.length;
    var curGroup = slides[idx].dataset.rail;
    railBtns.forEach(function(b){ b.classList.toggle('current', b.dataset.group === curGroup); });
    prevBtn.disabled = idx===0;
    nextBtn.disabled = idx===slides.length-1;
  }
  function go(i){ idx = Math.max(0, Math.min(slides.length-1, i)); render(); }
  function next(){ go(idx+1); }
  function prev(){ go(idx-1); }
  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);
  window.addEventListener('keydown', function(e){
    if(['ArrowRight','PageDown',' '].indexOf(e.key)>-1){ e.preventDefault(); next(); }
    else if(['ArrowLeft','PageUp'].indexOf(e.key)>-1){ e.preventDefault(); prev(); }
    else if(e.key==='Home'){ e.preventDefault(); go(0); }
    else if(e.key==='End'){ e.preventDefault(); go(slides.length-1); }
  });
  render();
  initGlossary();
})();
</script>
